<template>
    <lightning-card title="Display data based on Filters" icon-name="custom:custom65">
        <div class="slds-p-around_small">
            <lightning-combobox name="AccountSource" 
                label="Account Source" value={value} placeholder="-Select-"
                options={pickListvalues} onchange={handleChange}>
            </lightning-combobox>
            <lightning-combobox name="Industry" 
                label="Industry By Record type" value={value} placeholder="-Select-"
                options={pickListvaluesByRecordType} onchange={handleChange}>
            </lightning-combobox>
            </div>  
    </lightning-card> 
</template>
