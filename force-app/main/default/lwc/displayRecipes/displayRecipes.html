<template>
    <lightning-card title="Food Recipes">
        <lightning-button variant="brand" label="Get random recipe" onclick={handlegetRandomRecipes}></lightning-button>
    <lightning-layout>
         <template for:each={recipeDetails.recipes} for:item="item" for:index="index">
                <lightning-layout-item key={item.index}>
                   <b>{item.title}</b> 
                   <br> <img src={item.image} style="background-image: url(image2)" />
                   <lightning-button variant="brand" value={item.title} label="Get Recipe Details" onclick={handleGetDetails}></lightning-button>
                   {instructions}
                </lightning-layout-item>
            </template>
       
    </lightning-layout>
    </lightning-card>
</template>
